<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="options.css" />
    <title>Fabrarian — Main decks</title>
  </head>
  <body>
    <header>
      <img src="../icons/icon32.png" alt="" width="28" height="28" />
      <h1>Fabrarian</h1>
    </header>

    <section>
      <h2>Main decks</h2>
      <p class="lead">
        One reference deck per hero. When you open any other deck for that hero on fabrary, a compact
        list of card differences appears in the page's right margin.
      </p>

      <form id="add" autocomplete="off">
        <input id="ref" type="text" placeholder="Paste a fabrary deck link (https://fabrary.net/decks/…)" spellcheck="false" />
        <button id="submit" type="submit">Set as main deck</button>
      </form>
      <p id="notice" class="notice" hidden></p>

      <ul id="list" class="decks"></ul>
      <p id="empty" class="empty" hidden>No main decks yet. Paste a deck link above to add one.</p>
    </section>

    <script type="module" src="options.js"></script>
  </body>
</html>
